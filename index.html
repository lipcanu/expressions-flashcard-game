<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expresiones españolas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chocolate+Classical+Sans&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbf7ec;
    --card: #fdfcf6;
    --ink: #1c1b17;
    --muted-ink: #7a7561;
    --primary: #a83626;
    --primary-dark: #7a2516;
    --primary-foreground: #ffffff;
    --secondary: #7cc7e0;
    --secondary-dark: #4ea7c4;
    --yellow: #f3d04a;
    --yellow-dark: #c9a52a;
    --pink: #e896b8;
    --pink-dark: #c46e91;
    --mint: #a8d5e0;
    --mint-dark: #7fb3c0;
    --accent: #fbf3dc;
    --destructive: #e85a3a;
    --destructive-dark: #b8401f;
    --border: #e89972;
    --shadow-color: #f5c8b3;
    --shadow-hard: 3px 3px 0 0 var(--shadow-color);
    --shadow-hard-sm: 2px 2px 0 0 var(--shadow-color);
    --shadow-hard-lg: 4px 4px 0 0 var(--shadow-color);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Chocolate Classical Sans', system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  main {
    max-width: 520px;
    margin: 0 auto;
    padding: 24px 20px 48px;
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 4px 20px;
  }
  header .brand {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px; height: 40px;
    border-radius: 12px;
    background: var(--card);
    border: 1.5px solid var(--border);
    box-shadow: var(--shadow-hard-sm);
    color: var(--primary);
  }
  header h1 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.2px;
    color: var(--ink);
  }

  .view { display: none; flex: 1; flex-direction: column; }
  .view.active { display: flex; animation: fadeUp 280ms ease-out both; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: var(--card);
    border-radius: 16px;
    border: 1.5px solid var(--border);
    box-shadow: var(--shadow-hard-lg);
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* Start view */
  #start .card { align-items: center; text-align: center; gap: 22px; padding: 36px 28px; }
  #start h2 { margin: 0; font-size: 1.6rem; font-weight: 700; }
  #start p { margin: 0; color: var(--muted-ink); line-height: 1.5; }
  #start .count {
    display: inline-block;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--accent);
    border: 1.5px solid var(--border);
    color: var(--primary);
    font-weight: 700;
    font-size: 0.9rem;
  }

  /* Quiz view */
  .topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 4px 4px 14px;
  }
  .progress {
    flex: 1;
    height: 14px;
    background: var(--accent);
    border: 1.5px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress > span {
    display: block;
    height: 100%;
    width: 0%;
    background: #5CD4E4;
    border-radius: 999px;
    transition: width 320ms ease;
  }
  .score {
    font-weight: 700;
    color: var(--primary);
    font-size: 0.95rem;
    min-width: 56px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .expression {
    margin: 0;
    font-size: clamp(1.4rem, 4.2vw, 1.9rem);
    font-weight: 700;
    line-height: 1.25;
    text-align: center;
    color: var(--ink);
  }
  .prompt {
    margin: 0;
    text-align: center;
    color: var(--primary);
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
  }

  .answers {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 4px;
  }
  .answer {
    position: relative;
    width: 100%;
    min-height: 60px;
    padding: 14px 18px 14px 56px;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    color: var(--ink);
    font-family: inherit;
    font-weight: 700;
    font-size: 1rem;
    line-height: 1.35;
    text-align: left;
    cursor: pointer;
    box-shadow: var(--shadow-hard-sm);
    transition: transform 140ms ease, background 200ms ease, opacity 200ms ease, box-shadow 140ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  .answer .num {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 30px; height: 30px;
    border-radius: 8px;
    background: rgba(255,255,255,0.45);
    border: 1.5px solid rgba(0,0,0,0.12);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.95rem;
  }
  .answer .icon {
    position: absolute;
    top: -12px;
    right: -12px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid currentColor;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(0.4);
    transition: opacity 200ms ease, transform 220ms cubic-bezier(.34,1.56,.64,1);
  }
  .answer.reveal .icon { opacity: 1; transform: scale(1); }
  .answer.correct .icon { color: #1f7a37; }
  .answer.wrong .icon   { color: #7a2516; }

  .answer { background: #fff; }
  .answer .num { background: var(--accent); border-color: var(--border); color: var(--primary); }

  .answer:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 0 var(--shadow-color); }
  .answer:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 0 0 0 0 var(--shadow-color); }
  .answer:disabled { cursor: default; }

  .answer.correct { background: #2fa84f !important; border-color: #1f7a37 !important; color: #fff !important; box-shadow: var(--shadow-hard-sm); }
  .answer.correct .num { background: rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.5); color: #fff; }
  .answer.wrong   { background: #b8401f !important; border-color: #7a2516 !important; color: #fff !important; box-shadow: var(--shadow-hard-sm); }
  .answer.wrong .num { background: rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.5); color: #fff; }
  .answer.faded   { opacity: 0.4; }

  .example {
    margin-top: 6px;
    padding: 14px 16px;
    border-radius: 12px;
    background: #e8f9fc;
    border: 1.5px solid #5CD4E4;
    border-left: 4px solid #5CD4E4;
    color: var(--ink);
    font-style: italic;
    line-height: 1.45;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transform: translateY(-6px);
    transition: opacity 240ms ease, transform 240ms ease, max-height 320ms ease, margin-top 240ms ease, padding 240ms ease;
  }
  .example.show {
    opacity: 1;
    max-height: 400px;
    transform: translateY(0);
    padding: 14px 16px;
  }

  .actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 4px;
    min-height: 52px;
  }
  .actions .btn { width: 100%; justify-content: center; background: #5CD4E4; border-color: #3aabb9; box-shadow: 3px 3px 0 0 #b8eaf2; color: var(--ink); }
  .btn {
    appearance: none;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    font-size: 1rem;
    padding: 14px 22px;
    border-radius: 14px;
    background: var(--primary);
    color: var(--primary-foreground);
    border: 1.5px solid var(--primary-dark);
    box-shadow: var(--shadow-hard);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: transform 120ms ease, box-shadow 120ms ease, opacity 200ms ease;
  }
  .btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 0 var(--shadow-color); }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 0 var(--shadow-color); }
  .btn.ghost {
    background: var(--card);
    color: var(--ink);
    border: 1.5px solid var(--border);
    box-shadow: var(--shadow-hard-sm);
  }
  .btn[hidden] { display: none; }

  /* Stats row */
  .statsbar {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin: 10px auto -22px;
    padding: 8px 18px;
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 999px;
    box-shadow: var(--shadow-hard-sm);
    font-size: 0.95rem;
    font-weight: 700;
    width: fit-content;
  }
  .statsbar .stat {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .statsbar .stat .ico {
    width: 22px; height: 22px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }
  .statsbar .stat.ok  { color: #2fa84f; }
  .statsbar .stat.err { color: #d83b3b; }
  .statsbar .stat.ok .ico  { background: #2fa84f; }
  .statsbar .stat.err .ico { background: #d83b3b; }
  .statsbar .sep { color: var(--border); font-weight: 400; }
  .statsbar svg { width: 14px; height: 14px; stroke-width: 3.5; color: #fff; }

  /* Results view */
  #results .card { align-items: center; text-align: center; gap: 18px; padding: 36px 28px; }
  #results .badge {
    width: 76px; height: 76px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--primary);
    border: 2px solid var(--border);
    box-shadow: var(--shadow-hard);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  #results h2 { margin: 0; font-size: 1.5rem; font-weight: 700; }
  #results .final-score {
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--primary);
    font-variant-numeric: tabular-nums;
  }
  #results .pct { color: var(--muted-ink); font-weight: 700; }
  #results .msg { color: var(--ink); line-height: 1.5; max-width: 32ch; }

  /* Confetti */
  .confetti {
    position: fixed;
    pointer-events: none;
    width: 9px; height: 14px;
    border-radius: 2px;
    will-change: transform, opacity;
    z-index: 50;
  }

  /* Lucide-style svg sizing */
  svg.lucide {
    width: 20px; height: 20px;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    stroke: currentColor;
  }
  svg.lucide.lg { width: 36px; height: 36px; stroke-width: 2; }
  .answer .icon svg { width: 18px; height: 18px; stroke-width: 3.5; color: currentColor; }

  @media (max-width: 420px) {
    main { padding: 18px 14px 40px; }
    .card { padding: 22px 18px; border-radius: 14px; }
    .answer { padding: 12px 16px 12px 52px; min-height: 56px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>
<main>
  <!-- Start view -->
  <section id="start" class="view active">
    <div class="card">
      <h2>¿Listo para practicar?</h2>
      <p>Elige el significado correcto en español. Cuatro opciones por carta.</p>
      <span class="count" id="totalCount"></span>
      <button class="btn" id="startBtn" type="button">
        Empezar
        <svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>
    </div>
  </section>

  <!-- Quiz view -->
  <section id="quiz" class="view">
    <div class="topbar">
      <div class="progress" aria-hidden="true"><span id="progressFill"></span></div>
      <div class="score" id="score" aria-live="polite">0 / 0</div>
    </div>
    <div class="statsbar">
      <span class="stat ok" id="statCorrect">
        <span class="ico"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
        <span id="statCorrectNum">0</span>
      </span>
      <span class="sep">|</span>
      <span class="stat err" id="statWrong">
        <span class="ico"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span>
        <span id="statWrongNum">0</span>
      </span>
    </div>
    <div class="card">
      <p class="prompt">¿Qué significa?</p>
      <h2 class="expression" id="expression"></h2>
      <div class="answers" id="answers" role="list"></div>
      <div class="example" id="example"></div>
      <div class="actions">
        <button class="btn" id="nextBtn" type="button" hidden>
          Siguiente
          <svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- Results view -->
  <section id="results" class="view">
    <div class="card">
      <span class="badge" id="resultBadge" aria-hidden="true"></span>
      <h2 id="resultTitle">¡Hecho!</h2>
      <div class="final-score"><span id="finalScore">0</span> / <span id="finalTotal">0</span></div>
      <div class="pct" id="finalPct"></div>
      <p class="msg" id="resultMsg"></p>
      <button class="btn" id="playAgainBtn" type="button">
        <svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
        Jugar de nuevo
      </button>
    </div>
  </section>
</main>

<script>
// ---------- Data (embedded from expressions.csv) ----------
const EXPRESSIONS = [
  {"expression":"ser un cabezota","correct":"alguien que no cambia de opinión por nada y se mantiene firme en su postura sin razón","example":"No le hagas caso es un cabezota","distractors":["alguien que tiene una memoria prodigiosa y recuerda todos los detalles con gran precisión","persona que habla demasiado y no sabe cuándo es el momento de callarse","alguien que toma decisiones de manera impulsiva sin pensar en las consecuencias para los demás"]},
  {"expression":"tener un morro que te lo pisas / tener mucha cara","correct":"tener mucha desvergüenza o atrevimiento para hacer o pedir algo sin sentir ningún tipo de vergüenza","example":"¡Qué morro tiene! Le dejé dinero y encima me pide más.","distractors":["ser muy hábil para negociar y conseguir lo que uno quiere mediante el diálogo persuasivo","mostrar una simpatía exagerada con todo el mundo para caerle bien a cualquiera","tener una apariencia física muy llamativa que atrae la atención de los demás sin esfuerzo"]},
  {"expression":"ser clavado a alguien","correct":"parecerse físicamente a alguien de manera muy notable como si fueran casi gemelos","example":"Eres clavada a tu madre.","distractors":["compartir el mismo carácter y forma de ser con otra persona de manera muy evidente","estar tan unido a alguien que resulta imposible imaginarse la vida sin esa persona","copiar los gestos y maneras de alguien de forma inconsciente por pasar mucho tiempo juntos"]},
  {"expression":"no tener dos dedos de frente","correct":"no tener sentido común ni capacidad de razonamiento básico; actuar sin pensar en las consecuencias","example":"¿Cómo pudo hacer eso? No tiene dos dedos de frente.","distractors":["ser muy torpe con las manos y no saber realizar tareas manuales por más que lo intente","no tener ningún tipo de ambición ni ganas de superarse en la vida personal o profesional","ser incapaz de recordar cosas sencillas y olvidarlo todo con mucha facilidad"]},
  {"expression":"tener buena pinta","correct":"tener un aspecto atractivo o prometedor a primera vista sin conocer aún el resultado","example":"Esta tortilla tiene muy buena pinta.","distractors":["tener muy buen olfato para los negocios y detectar oportunidades con facilidad","tener un carácter tan agradable que la gente se siente cómoda en su presencia enseguida","saber vestirse bien y presentarse de forma impecable en cualquier situación social"]},
  {"expression":"meter la pata","correct":"decir o hacer algo inapropiado sin querer causando una situación incómoda o embarazosa","example":"Metí la pata cuando le pregunté cuándo era la boda… y ya se habían separado.","distractors":["entrometerse en los asuntos ajenos sin que nadie haya pedido la opinión de uno","retrasar el inicio de una tarea por indecisión o falta de motivación suficiente","cometer el mismo error repetidamente sin aprender de las experiencias pasadas"]},
  {"expression":"colarse en...","correct":"entrar a un lugar sin autorización o saltarse el turno sin esperar como los demás","example":"Se coló en el concierto sin entrada.","distractors":["perderse por un lugar desconocido al no haber prestado atención al camino de entrada","entrar en un sitio con mucho sigilo para sorprender a alguien sin que te vean llegar","esconderse en un lugar para evitar cruzarse con alguien a quien no se quiere ver"]},
  {"expression":"creerse el ombligo del mundo","correct":"creer que uno es la persona más importante del mundo y que todo gira a su alrededor","example":"No la soporto se cree el ombligo del mundo.","distractors":["pensar que uno es el más inteligente y que los demás no están a la altura de sus ideas","sentirse constantemente observado y juzgado por los demás sin ningún motivo real","creer que sus propios problemas son siempre más graves que los de cualquier otra persona"]},
  {"expression":"ponerse morado","correct":"comer o beber en exceso hasta hartarse por completo","example":"Nos pusimos morados de paella.","distractors":["enfadarse tanto que uno no es capaz de controlar sus reacciones ni sus palabras","avergonzarse de algo hasta el punto de sonrojarse delante de los demás","trabajar sin descanso hasta quedarse completamente agotado y sin energía alguna"]},
  {"expression":"ponerse las botas","correct":"disfrutar al máximo de algo ya sea comida o cualquier otra oportunidad aprovechándola sin límites","example":"Se puso las botas en las rebajas.","distractors":["prepararse con mucho cuidado antes de emprender un viaje largo o una aventura importante","esforzarse al máximo en algo con el objetivo de demostrar lo que uno vale de verdad","actuar con total seguridad en uno mismo en cualquier situación sin importar las dificultades"]},
  {"expression":"tener un cacao mental / tener la cabeza hecha un lío","correct":"tener los pensamientos completamente desordenados y no ser capaz de pensar con claridad normalmente de forma temporal","example":"Llevo toda la semana con un cacao mental no sé ni por dónde empezar.","distractors":["tener demasiadas obligaciones al mismo tiempo y no saber a cuál darle prioridad","estar tan cansado que resulta imposible concentrarse en nada durante un buen rato","recordar algo de manera confusa sin estar seguro de si realmente ocurrió o fue un sueño"]},
  {"expression":"hacer la vista gorda","correct":"fingir que no se ve algo incorrecto que está pasando para no tener que intervenir o enfrentarse a ello","example":"El jefe hacía la vista gorda con los retrasos del equipo.","distractors":["exagerar a propósito lo que uno ve para conseguir despertar la compasión de los demás","observar a alguien durante demasiado tiempo hasta resultar incómodo o molesto","no darse cuenta de lo que ocurre alrededor por falta de atención o perspicacia propia"]},
  {"expression":"dar la lata","correct":"molestar a alguien de forma repetida o insistente sin dejarle tranquilo","example":"¡Deja de dar la lata y déjame trabajar!","distractors":["hablar durante mucho tiempo sin parar sobre el mismo tema sin llegar a ningún punto","quejarse constantemente de todo sin estar dispuesto a buscar ninguna solución posible","exigir a los demás un nivel de perfección que muy poca gente puede alcanzar"]},
  {"expression":"ni chicha ni limonada","correct":"algo o alguien que no es ni una cosa ni la otra que no tiene una identidad o posición clara","example":"Su respuesta fue ni chicha ni limonada nunca supe si venía o no.","distractors":["una mezcla extraña de elementos que no pegan entre sí y resulta difícil de entender","algo que empieza con mucho potencial pero acaba siendo una gran decepción al final","una persona que promete una cosa y hace la contraria sin ningún tipo de coherencia"]},
  {"expression":"a buenas horas mangas verdes","correct":"expresión irónica que se usa cuando alguien llega o actúa cuando ya es demasiado tarde para que sirva de algo","example":"¡A buenas horas mangas verdes! Ya terminamos todo sin ti.","distractors":["hacer algo con un entusiasmo exagerado que no se corresponde en absoluto con la situación","aparecer justo en el momento oportuno para llevarse el mérito de lo que hicieron otros","llegar antes de lo esperado poniendo a los demás en una situación incómoda e imprevista"]},
  {"expression":"estar en Babia / estar a por uvas / estar en la parra","correct":"estar distraído y con la mente en otro lugar sin prestar atención a lo que ocurre alrededor","example":"Le pregunté tres veces y no me contestó estaba en Babia.","distractors":["estar muy cansado y sin energía después de un esfuerzo físico o mental considerable","estar esperando algo con tanta impaciencia que resulta imposible pensar en otra cosa","sentirse completamente perdido en un entorno desconocido sin saber cómo orientarse"]},
  {"expression":"tirar la casa por la ventana","correct":"gastar muchísimo dinero sin reparar en el coste normalmente para celebrar algo especial","example":"Para la boda de su hija tiraron la casa por la ventana.","distractors":["deshacerse de todas las pertenencias antiguas para empezar de cero una nueva etapa vital","actuar de manera impulsiva y sin pensar causando daños que son difíciles de reparar","compartir todo lo que uno tiene con los demás sin guardar nada para sí mismo"]},
  {"expression":"mucho ruido y pocas nueces / perro ladrador poco mordedor / mucho lirili y poco lirile","correct":"hacer mucho ruido o aparentar mucho pero luego no cumplir ni tener la sustancia que se prometía","example":"Al final su presentación fue mucho ruido y pocas nueces.","distractors":["trabajar mucho y con esfuerzo pero obtener resultados que no están a la altura esperada","quejarse constantemente de las dificultades sin hacer nada por cambiar la situación","llamar mucho la atención al principio pero acabar pasando desapercibido con el tiempo"]},
  {"expression":"irse de rositas","correct":"hacer algo malo o incorrecto y salir sin recibir ningún castigo ni consecuencia por ello","example":"Rompió todas las reglas y se fue de rositas.","distractors":["marcharse de un lugar con mucha elegancia dejando una buena impresión en todos","salir de una situación muy difícil gracias a la suerte sin haber hecho nada especial","retirarse de un proyecto en el último momento cuando más se necesitaba la presencia de uno"]},

// ---------- State ----------
let deck = [];
let index = 0;
let score = 0;
let wrong = 0;
let answered = false;
let currentButtons = [];

// ---------- Helpers ----------
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const $ = (sel) => document.querySelector(sel);

function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  $('#' + id).classList.add('active');
}

// ---------- Game flow ----------
function startGame() {
  deck = shuffle([...EXPRESSIONS]);
  index = 0;
  score = 0;
  wrong = 0;
  showView('quiz');
  renderCard();
}

function renderCard() {
  answered = false;
  const card = deck[index];
  $('#expression').textContent = card.expression;

  const options = shuffle([
    { text: card.correct, correct: true },
    ...card.distractors.map(d => ({ text: d, correct: false }))
  ]);

  const answersEl = $('#answers');
  answersEl.innerHTML = '';
  currentButtons = [];

  options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'answer';
    btn.dataset.correct = String(opt.correct);
    btn.innerHTML = `
      <span class="num">${i + 1}</span>
      <span class="text"></span>
      <span class="icon"></span>
    `;
    btn.querySelector('.text').textContent = opt.text;
    btn.addEventListener('click', () => handleAnswer(btn, opt.correct));
    answersEl.appendChild(btn);
    currentButtons.push(btn);
  });

  const ex = $('#example');
  ex.classList.remove('show');
  ex.textContent = '';

  $('#nextBtn').hidden = true;

  updateProgress();
  // Re-trigger card entrance animation
  const quiz = $('#quiz');
  quiz.classList.remove('active');
  void quiz.offsetWidth;
  quiz.classList.add('active');
}

function updateProgress() {
  $('#progressFill').style.width = (index / deck.length) * 100 + '%';
  $('#score').textContent = `${score + wrong} / ${deck.length}`;
  $('#statCorrectNum').textContent = score;
  $('#statWrongNum').textContent = wrong;
}

function handleAnswer(btn, isCorrect) {
  if (answered) return;
  answered = true;

  currentButtons.forEach(b => {
    b.disabled = true;
    if (b !== btn && b.dataset.correct !== 'true') b.classList.add('faded');
  });

  if (isCorrect) {
    btn.classList.add('correct', 'reveal');
    btn.querySelector('.icon').innerHTML = ICONS.check;
    score++;
    confettiBurst(btn);
  } else {
    btn.classList.add('wrong', 'reveal');
    btn.querySelector('.icon').innerHTML = ICONS.x;
    wrong++;
    const correctBtn = currentButtons.find(b => b.dataset.correct === 'true');
    if (correctBtn) {
      correctBtn.classList.remove('faded');
      correctBtn.classList.add('correct', 'reveal');
      correctBtn.querySelector('.icon').innerHTML = ICONS.check;
    }
  }

  // Fill bar immediately to reflect this card as done
  $('#progressFill').style.width = ((index + 1) / deck.length) * 100 + '%';
  $('#score').textContent = `${score + wrong} / ${deck.length}`;
  $('#statCorrectNum').textContent = score;
  $('#statWrongNum').textContent = wrong;

  const card = deck[index];
  const ex = $('#example');
  ex.textContent = card.example;
  // Force reflow so transition triggers
  void ex.offsetWidth;
  ex.classList.add('show');

  $('#score').textContent = `${score + wrong} / ${deck.length}`;

  const next = $('#nextBtn');
  next.hidden = false;
  next.focus({ preventScroll: true });
}

function next() {
  index++;
  if (index >= deck.length) {
    showResults();
  } else {
    renderCard();
  }
}

function showResults() {
  const total = deck.length;
  const pct = total ? score / total : 0;
  $('#finalScore').textContent = score;
  $('#finalTotal').textContent = total;
  $('#finalPct').textContent = `${Math.round(pct * 100)}%`;

  let badge, msg, title;
  if (pct >= 0.8) {
    title = '¡Increíble!';
    msg = 'Eres un crack del español. Sigue así.';
    badge = ICONS.trophy;
  } else if (pct >= 0.5) {
    title = '¡Bien hecho!';
    msg = 'Vas por buen camino. Una ronda más y dominas estas expresiones.';
    badge = ICONS.thumbs;
  } else {
    title = '¡Sigue practicando!';
    msg = 'Tú puedes. La repetición es la clave — vuelve a intentarlo.';
    badge = ICONS.redo;
  }
  $('#resultTitle').textContent = title;
  $('#resultMsg').textContent = msg;
  $('#resultBadge').innerHTML = badge;

  // Fill progress bar to 100% before leaving the quiz view
  $('#progressFill').style.width = '100%';

  showView('results');
  $('#playAgainBtn').focus({ preventScroll: true });
}

// ---------- Confetti ----------
const CONFETTI_COLORS = ['#a83626', '#7cc7e0', '#f3d04a', '#e896b8', '#e85a3a', '#a8d5e0'];
function confettiBurst(originEl) {
  const rect = originEl.getBoundingClientRect();
  const x0 = rect.left + rect.width / 2;
  const y0 = rect.top + rect.height / 2;
  const count = 22;
  for (let i = 0; i < count; i++) {
    const piece = document.createElement('span');
    piece.className = 'confetti';
    piece.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
    piece.style.left = x0 + 'px';
    piece.style.top = y0 + 'px';
    const angle = (Math.PI * (Math.random() * 0.8 + 0.1)) * -1;
    const speed = 220 + Math.random() * 240;
    const dx = Math.cos(angle) * speed * (Math.random() < 0.5 ? -1 : 1);
    const dy = Math.sin(angle) * speed - 80;
    const rot = (Math.random() * 720 - 360) + 'deg';
    const dur = 900 + Math.random() * 500;
    piece.animate(
      [
        { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
        { transform: `translate(${dx}px, ${dy + 360}px) rotate(${rot})`, opacity: 0 }
      ],
      { duration: dur, easing: 'cubic-bezier(.2,.6,.4,1)' }
    );
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), dur + 60);
  }
}

// ---------- Wiring ----------
$('#totalCount').textContent = `${EXPRESSIONS.length} expresiones`;
$('#startBtn').addEventListener('click', startGame);
$('#nextBtn').addEventListener('click', next);
$('#playAgainBtn').addEventListener('click', startGame);

document.addEventListener('keydown', (e) => {
  const activeId = document.querySelector('.view.active')?.id;

  if (activeId === 'start') {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startGame(); }
    return;
  }

  if (activeId === 'results') {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startGame(); }
    return;
  }

  if (activeId === 'quiz') {
    if (!answered && /^[1-4]$/.test(e.key)) {
      const i = parseInt(e.key, 10) - 1;
      const btn = currentButtons[i];
      if (btn) { e.preventDefault(); btn.click(); }
    } else if (answered && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      next();
    }
  }
});
</script>
